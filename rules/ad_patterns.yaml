# 광고성 패턴 + 과대광고 패턴 ad_v1  (기획안 5-1, 5-2)
# - AI 학습 없이 규칙으로 처리. 패턴을 고칠 때는 이 파일만 수정하면 됨 (코드 수정 X)
# - regex는 파이썬 re 문법. 대소문자 무시(IGNORECASE)로 검사함
# - 고칠 때마다 updated_at 날짜와 아래 "변경 기록"을 같이 바꾸기

version: "ad_v1"
updated_at: "2026-10-30"

# 변경 기록
#   ad_v1 (10/30, A): 첫 버전. 표시 문구 10개 / 광고성 신호 20개 / 과대광고 20개

# ─────────────────────────────────────────────
# 1. 광고·협찬 표시 문구  → 하나라도 있으면 disclosure_found = true
#    (있으면 "표시 누락" finding을 만들지 않음)
# ─────────────────────────────────────────────
disclosure:
  - id: tag_ad
    regex: '#\s*(광고|유료\s*광고|협찬|ad\b|sponsored|pr\b)'
  - id: paid_ad
    regex: '유료\s*광고(를)?\s*(포함|포함하고)'
  - id: ad_label
    regex: '\[\s*(광고|협찬|AD|PR)\s*\]|\(\s*(광고|협찬|AD)\s*\)'
  - id: sponsored_word
    regex: '협찬(을|으로|받|품|제품)'
  - id: provided
    regex: '(제품|상품|서비스|체험단).{0,6}(제공\s*받|무상\s*(으로\s*)?제공)'
  - id: fee
    regex: '(소정의|일정)\s*(원고료|광고비|수수료|대가)'
  - id: affiliate
    regex: '(쿠팡\s*)?파트너스\s*활동|제휴\s*마케팅|수수료를\s*(제공\s*)?받'
  - id: ad_start
    regex: '^\s*광고\s*[)\]:|]'
  - id: ad_alone   # [W8] 이미지 구석 배지처럼 한 줄에 '광고'·'협찬'·'AD'만 있는 경우 (OCR은 상자마다 줄바꿈)
    regex: '^\s*(광고|유료\s*광고|협찬|AD|PR)\s*$'
  - id: incl_ad
    regex: '광고\s*(포함|입니다|글입니다|게시물)'
  - id: en_sponsored
    regex: '\b(sponsored|paid\s*partnership|유료\s*파트너십)\b'

# ─────────────────────────────────────────────
# 2. 광고성 신호  → 구매·홍보를 유도하는 표현
#    weight: 이 패턴 하나가 얼마나 광고 같은지 (0–1)
#    score = 1 − Π(1 − weight)  (서로 다른 패턴끼리만 곱함, 같은 패턴이 여러 번 나와도 1번)
#    score ≥ threshold 이면 광고성으로 판단
#      - 강한 신호(0.6↑) 하나만 있어도 감지   예: "쿠폰코드 SALE10"
#      - 약한 신호(0.3) 하나는 감지 안 됨      예: "이 영화 강추" → 오탐 방지
#      - 약한 신호 두 개면 감지 (0.51)          예: "강추! 인생템이에요"
# ─────────────────────────────────────────────
ad_signal:
  threshold: 0.5
  patterns:
    # 강한 신호: 구매 경로·금전 혜택
    - id: coupon_code
      regex: '(쿠폰|할인|프로모션|추천인)\s*코드'
      weight: 0.8
    - id: buy_link
      regex: '(구매|구입|주문|제품|상품|할인)\s*링크'
      weight: 0.8
    - id: profile_link
      regex: '(프로필|프로필\s*상단|바이오|bio)\s*(의\s*)?링크|링크(는|를)?\s*(프로필|바이오|bio)'
      weight: 0.7
    - id: link_click
      regex: '링크\s*(클릭|누르|타고|에서\s*(구매|주문))'
      weight: 0.6
    - id: group_buy
      regex: '공동\s*구매|공구\s*(오픈|진행|시작|마감)|공구가'
      weight: 0.8
    - id: discount_rate
      regex: '\d{1,2}\s*%\s*(할인|세일|off)|(할인|세일)\s*\d{1,2}\s*%'
      weight: 0.6
    - id: special_price
      regex: '특가|최저가|한정\s*(수량|판매|특가)|단독\s*(판매|특가|구성)'
      weight: 0.6
    - id: first_come
      regex: '선착순'
      weight: 0.5
    - id: free_shipping
      regex: '무료\s*배송|무배'
      weight: 0.5
    - id: order_now
      regex: '지금\s*(바로\s*)?(구매|주문|구입)|(구매|주문)\s*(하러\s*가기|바로\s*가기)'
      weight: 0.7
    - id: dm_order
      regex: '(DM|디엠|문의)\s*(주세요|주시면|으로\s*주문)'
      weight: 0.5
    - id: price_won
      regex: '\d[\d,]*\s*원(에|으로|이면)?\s*(구매|득템|겟|get)'
      weight: 0.5
    - id: event_gift
      regex: '(이벤트|사은품|증정|기프트)\s*(진행|중|드려요|드립니다)'
      weight: 0.4
    # 약한 신호: 일반 후기·추천에도 자주 쓰임 → 하나만으로는 감지 안 됨
    - id: recommend
      regex: '추천(해요|합니다|드려요|드립니다)'
      weight: 0.3
    - id: must_buy
      regex: '강추|강력\s*추천|무조건\s*사세요|꼭\s*사세요'
      weight: 0.3
    - id: item_slang
      regex: '인생템|꿀템|잇템|필수템'
      weight: 0.3
    - id: brand_product
      regex: '(이|요|저)\s*(제품|브랜드)\s*(덕분|진짜|너무)'
      weight: 0.2
    - id: review_cta
      regex: '(후기|리뷰)\s*(남겨|보러|확인)'
      weight: 0.2
    - id: hashtag_shop
      regex: '#\s*(공구|협업|브랜드|신제품|체험단)'
      weight: 0.4
    - id: sale_period
      regex: '(오늘|이번\s*주|주말)\s*(까지만|한정|마감)'
      weight: 0.4

# ─────────────────────────────────────────────
# 3. 과대·과장 광고 표현  (ad_rule.exaggeration)
#    광고성 감지 여부와 상관없이 항상 검사 (기획안 5-1 마지막 줄)
#    verdict: 위반 = 의학적 효능·안전성 단정처럼 근거가 있어도 쓰기 어려운 것
#             검토 필요 = 실증 자료가 있으면 쓸 수 있는 것 ("1위", "최초" 등)
#    exclude: 이 정규식이 같은 문장 근처(앞뒤 10자)에 있으면 건너뜀 → 오탐 방지
# ─────────────────────────────────────────────
exaggeration:
  # 의학적 효능·안전성 단정 → 위반
  - id: cure
    regex: '완치|(병|질환|질병|암|아토피|탈모)(을|를)?\s*(고치|치료|낫)'
    verdict: 위반
    confidence: 0.9
    label_hint: 질병 치료 효능 표현
  - id: no_side_effect
    regex: '부작용\s*(이\s*)?(없(는|음|어요|습니다|이)?|zero|제로|0)'
    verdict: 위반
    confidence: 0.9
    label_hint: 안전성 단정 표현
  - id: cure_all
    regex: '만병\s*통치|특효(약)?'
    verdict: 위반
    confidence: 0.9
    label_hint: 만능 효능 표현
  - id: diet_quick
    regex: '(먹기만|바르기만|마시기만)\s*(해도|하면)|-\s*\d+\s*kg|\d+\s*(일|주)\s*(만에|안에)\s*-?\s*\d+\s*kg'
    verdict: 위반
    confidence: 0.85
    label_hint: 노력 없는 효과 단정
  - id: doctor_endorse
    regex: '(의사|약사|한의사|전문의|교수|전문가)(가|들이|도)?\s*(추천|인정|보증|강추)'
    verdict: 검토 필요
    confidence: 0.75
    label_hint: 전문가 추천 표현 (AI 가상 전문가라면 식품 광고에서 금지 예정)
  # 단정·절대 표현 → 실증 자료 필요 → 검토 필요 (100%는 효과 단정이면 위반)
  - id: hundred_percent
    regex: '100\s*%'
    verdict: 검토 필요
    confidence: 0.7
    label_hint: 100% 단정 표현
    exclude: '100\s*%\s*(면|순면|코튼|cotton|울|실크|국내산|환불|정품|생과일|원두|착즙|천연\s*소재)'
  - id: hundred_effect
    regex: '100\s*%\s*(효과|개선|만족|해결|제거|흡수|성공)'
    verdict: 위반
    confidence: 0.9
    label_hint: 효과 100% 단정
  - id: absolute
    regex: '무조건\s*(효과|빠|좋아|된|낫|해결)|반드시\s*(효과|빠|된)|효과\s*(보장|확실)'
    verdict: 검토 필요
    confidence: 0.75
    label_hint: 효과 보장 표현
  - id: first
    regex: '(국내|세계|업계|최)\s*최초'
    verdict: 검토 필요
    confidence: 0.7
    label_hint: 최초 주장 (실증 자료 필요)
  - id: best
    regex: '(국내|세계|업계)\s*(최고|1위|일등|넘버원)|판매\s*1위|만족도\s*1위|최고의\s*(효과|제품)'
    verdict: 검토 필요
    confidence: 0.7
    label_hint: 최고·1위 주장 (출처·기간 표시 필요)
  - id: only_one
    regex: '(유일한|유일하게|오직\s*이\s*제품)'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 유일 주장
  - id: instant
    regex: '(즉시|즉각|바로|하루\s*만에)\s*(효과|개선|변화|빠|사라)'
    verdict: 검토 필요
    confidence: 0.7
    label_hint: 즉시 효과 표현
  - id: permanent
    regex: '(영구|평생)\s*(효과|지속|제거)|다시는\s*(안|생기지)'
    verdict: 검토 필요
    confidence: 0.7
    label_hint: 영구 효과 표현
  - id: miracle
    regex: '기적(의|같은|적인)?\s*(효과|크림|제품|변화)?|마법\s*(같은|의)\s*(효과|크림)'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 기적·마법 표현
    exclude: '기적(을|이)\s*(바라|믿)'
  - id: perfect
    regex: '완벽(하게|한)\s*(제거|개선|해결|차단)'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 완벽 단정
  - id: guarantee
    regex: '(효과|결과|성공)\s*(를\s*)?보장|안\s*되면\s*(전액\s*)?환불'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 효과 보장 표현
  - id: clinical
    regex: '임상\s*(으로\s*)?(입증|증명|검증)|과학적으로\s*(입증|증명)'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 임상·과학 입증 주장 (실증 자료 필요)
  - id: fda
    regex: '(FDA|식약처)\s*(승인|인증|허가)'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 인증 주장 (실제 인증 범위 확인 필요)
  - id: ai_washing
    regex: '\bAI\s*(기반|가\s*분석|맞춤|기술로|알고리즘)|인공지능\s*(기반|이\s*분석|맞춤)'
    verdict: 검토 필요
    confidence: 0.55
    label_hint: AI 기술 주장 (AI 워싱, 실증 자료 필요)
  - id: no_risk
    regex: '(전혀|절대)\s*(해롭지|위험하지|자극\s*없|문제\s*없)|무해(한|합니다)'
    verdict: 검토 필요
    confidence: 0.6
    label_hint: 무해 단정 표현

# ─────────────────────────────────────────────
# 4. 고정 안내 문구 (규칙 단계는 LLM 없이 이 문장을 그대로 씀, v0.2 2-4)
#    {text} 자리에 걸린 표현이 들어감. 근거 조항(evidence)은 나중에 RAG가 채움
# ─────────────────────────────────────────────
messages:
  missing_disclosure:
    ad: "광고 목적의 게시물인데 '광고'·'협찬' 표시가 보이지 않아요. 제목이나 첫 부분에 표시해주세요."
    none: "'{text}'처럼 구매를 유도하는 표현이 있지만 '광고'·'협찬' 표시가 없어요."
  missing_disclosure_question: "혹시 광고나 협찬 상품인가요? 그렇다면 제목이나 첫 부분에 '광고' 또는 '협찬'을 표시해주세요."
  exaggeration:
    위반: "'{text}'은(는) {hint}이라 근거가 있어도 광고에 쓰기 어렵거나, 거짓·과장 광고가 될 수 있어요."
    검토 필요: "'{text}'은(는) {hint}이에요. 객관적인 실증 자료가 없으면 거짓·과장 광고가 될 수 있어요."
  exaggeration_question: "이 표현을 뒷받침할 실증 자료(시험 결과·조사 출처·기간)가 있나요?"